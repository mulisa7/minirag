[project]
name = "minirag"
version = "0.1.0"
description = "Small retrieval-augmented document search: BM25 retrieval, extractive or local-LLM answers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf"]
dev = ["pytest"]

[project.scripts]
minirag = "minirag.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["minirag"]
